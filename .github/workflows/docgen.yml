# Generated by docgen. Configure main.kit.doc in the SDK model.
name: Documentation
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install the project toolchain
        working-directory: .sdk
        run: npm install --no-audit --no-fund
      - name: Generate documentation from the committed model
        working-directory: .sdk
        run: |
          npm exec -- tsc --build src
          node node_modules/@voxgig/docgen/bin/voxgig-docgen generate ..
      - name: Install Vale
        env:
          VALE_VERSION: '3.14.0'
        run: |
          curl -fsSL -o /tmp/vale.tar.gz "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          tar -xzf /tmp/vale.tar.gz -C /tmp vale
          sudo install /tmp/vale /usr/local/bin/vale
      - name: Install the pinned prose rules
        run: vale --config=.sdk/doc/qa/vale.ini sync
      - name: Build presentation presentation
        env:
          EDITION_PATH: "docs/slidev"
        run: |
          npm install --prefix "$EDITION_PATH" --no-audit --no-fund
          npm run build --prefix "$EDITION_PATH"
      - name: Check every edition
        run: node .sdk/node_modules/@voxgig/docgen/bin/voxgig-docgen qa
      - name: Stage generated website
        id: site
        run: echo "path=$(node .sdk/node_modules/@voxgig/docgen/bin/voxgig-docgen stage github-pages)" >> "$GITHUB_OUTPUT"
      - name: Upload documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation
          path: ${{ steps.site.outputs.path }}
          include-hidden-files: true
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: documentation
          path: site-source
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site-source
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment

