# Univec SDK for Lean 4 (generated by @voxgig/sdkgen).
name = "voxgig-univec-sdk"
version = "0.1.2"
defaultTargets = ["SdkClient"]

# SECRETS FFI (see Makefile): the plugin groups this model selected bind
# libcurl through src/feature/secrets/ffi/*.c. `make ffi` compiles them and
# writes link.rsp; build and run through make, which also sets LEAN_CC.
moreLinkArgs = ["@src/feature/secrets/ffi/link.rsp"]

[[lean_lib]]
name = "Vregex"
srcDir = "src"

[[lean_lib]]
name = "VoxgigStruct"
srcDir = "src"

[[lean_lib]]
name = "SdkJson"
srcDir = "src"

[[lean_lib]]
name = "SdkUtility"
srcDir = "src"

[[lean_lib]]
name = "SdkFeature"
srcDir = "src"

[[lean_lib]]
name = "SdkFeatures"
srcDir = "src"

[[lean_lib]]
name = "SdkRuntime"
srcDir = "src"

[[lean_lib]]
name = "SdkConfig"
srcDir = "src"

[[lean_lib]]
name = "SdkClient"
srcDir = "src"

# THE SECRETS FEATURE: the vendored voxgig/plugin and sekreto ports, each
# tree its own srcDir root so upstream's imports resolve unchanged; the
# plugin kinds the model selected (SekretoPlugins.*, no barrel); the feature
# over them; and its shipped suite. All of it lives under
# src/feature/secrets/ and test/feature/secrets/, which `feature add` trims
# together with this block.
[[lean_lib]]
name = "Plugin"
srcDir = "src/feature/secrets/plugin"
globs = ["Plugin", "Plugin.*"]

[[lean_lib]]
name = "Sekreto"
srcDir = "src/feature/secrets/sekreto"
globs = ["Sekreto", "Sekreto.*"]

[[lean_lib]]
name = "SekretoPlugins"
srcDir = "src/feature/secrets/sekreto/plugins"
globs = ["SekretoPlugins.*"]

[[lean_lib]]
name = "SecretsFeature"
srcDir = "src/feature/secrets"

[[lean_exe]]
name = "secrets"
srcDir = "test/feature/secrets"
root = "TSecrets"

# The corpus ENGINE: the vendored @voxgig/omni Lean port, source rather than
# a dependency. Its own lean_lib so Lake can find the module, and
# deliberately NOT in defaultTargets: only the test executables import it, so
# `lake build` compiles the shipped library without it and nothing a
# consumer installs ever names omni. Lake has no test-scoped dependency, so
# vendoring is what keeps that isolation.
[[lean_lib]]
name = "Omni"
srcDir = "test/vendor/omni"

# The adapter that drives omni's native API with subjects built from this
# SDK's own utilities. Imported by the corpus suites and the smoke test.
[[lean_lib]]
name = "OmniResolver"
srcDir = "test"

[[lean_exe]]
name = "runner"
srcDir = "test"
root = "Runner"

[[lean_exe]]
name = "structcorpus"
srcDir = "test"
root = "StructCorpus"

[[lean_exe]]
name = "primary"
srcDir = "test"
root = "TPrimaryUtility"

[[lean_exe]]
name = "feature"
srcDir = "test"
root = "TFeature"

# Smoke test for the vendored engine itself: a runner that cannot FAIL a bad
# entry would turn every corpus suite vacuously green.
[[lean_exe]]
name = "omnismoke"
srcDir = "test"
root = "OmniSmoke"
