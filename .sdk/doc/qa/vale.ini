# Adapted from aontu's pinned Google/Vale configuration. Docgen uses a
# neutral voice in every edition. The local gate handles first person,
# punctuation, emoji, and banned phrases across line wraps.
StylesPath = styles
MinAlertLevel = suggestion
Vocab = Docgen
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip

[*.txt]
BasedOnStyles = Vale, Google, Docgen
Vale.Spelling = error
Vale.Avoid = error
Google.Latin = error
Google.Ellipses = error
Docgen.WordChoice = error
# British spelling; API and SDK names are accepted in the vocabulary.
Google.Spelling = NO
# Covered more precisely by the local neutral-voice and punctuation checks.
Google.FirstPerson = NO
Google.We = NO
Google.EmDash = NO
Google.Exclamation = NO
# Advisory style choices and context-sensitive rules, as in aontu.
Google.Passive = suggestion
Google.Contractions = suggestion
Google.Parens = suggestion
Google.Semicolons = suggestion
Google.OxfordComma = warning
Google.ExcessiveClaims = warning
Google.Anthropomorphism = warning
Google.WordListCase = warning
Google.WordList = warning
Google.Acronyms = warning
Google.Colons = warning
Google.Headings = warning
Google.Quotes = warning
Google.LyHyphens = warning
Google.Units = warning
Google.Will = warning
Google.Timeless = warning

# Rendered navigation and table cells are separate text fragments. The first
# Univec run reported 56 repetitions across those boundaries, such as the
# API title beside the API section. The local gate checks adjacent words
# inside prose lines; Vale's wider repetition rule remains advisory.
Vale.Repetition = warning
