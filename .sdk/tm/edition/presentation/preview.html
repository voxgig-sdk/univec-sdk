<!doctype html>
<html lang="en" data-mode="{{mode}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}: presentation preview</title>
<!--
  A STATIC preview of the deck. No JavaScript, no build step.

  The Slidev deck itself is a single-page application: its index.html is a
  1KB shell around a module script, so it shows nothing at all unless the
  bundle loads and runs. That makes the deck unreadable from a plain file
  view, from anything that does not execute scripts, and from a checkout
  where the deck has never been built. This page is the same slides, in
  document order, as ordinary HTML.
-->
<link rel="stylesheet" href="./assets/style.css">
<style>
:root { color-scheme: light; --bg: {{background}}; --fg: {{text}}; --primary: {{primary}}; --accent: {{accent}};
  --card: color-mix(in srgb, var(--fg) 5%, var(--bg)); --line: color-mix(in srgb, var(--fg) 16%, transparent); }
{{darkBlock}}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: {{font}}; line-height: 1.55; }
.wrap { max-width: 60rem; margin: 0 auto; padding-block: 2.5rem 4rem; padding-left: 1rem; padding-right: 1rem; }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1rem; margin-bottom: 2rem; }
header.top img { height: 2.25rem; width: auto; max-width: 100%; }
header.top h1 { font-family: {{headingFont}}; font-size: 1.5rem; margin: 0; color: var(--primary); }
.lede { margin: 0 0 2rem; color: color-mix(in srgb, var(--fg) 72%, transparent); }
.actions { display: flex; flex-wrap: wrap; gap: .5rem .75rem; margin-bottom: 2.5rem; }
.actions a { display: inline-block; padding: .4rem .85rem; border: 1px solid var(--line); border-radius: 999px;
  color: var(--primary); text-decoration: none; font-size: .9rem; }
.actions a:hover { border-color: var(--primary); }
.slide { background: var(--card); border: 1px solid var(--line); border-radius: .75rem;
  padding: 1.5rem 1.75rem; margin-bottom: 1.25rem; overflow-wrap: anywhere; }
.slide > .n { display: block; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--accent); margin-bottom: .5rem; }
.slide h2 { font-family: {{headingFont}}; font-size: 1.2rem; margin: 0 0 .75rem; color: var(--fg); }
.slide ul { margin: 0; padding-left: 1.25rem; }
.slide li + li { margin-top: .35rem; }
.slide p { margin: 0 0 .75rem; }
.slide p:last-child, .slide ul:last-child { margin-bottom: 0; }
code { font-family: {{mono}}; font-size: .9em; background: color-mix(in srgb, var(--fg) 8%, transparent);
  padding: .1em .35em; border-radius: .25rem; }
pre { overflow-x: auto; background: color-mix(in srgb, var(--fg) 8%, transparent);
  padding: .9rem 1rem; border-radius: .5rem; }
pre code { background: none; padding: 0; }
footer { margin-top: 2.5rem; font-size: .85rem; color: color-mix(in srgb, var(--fg) 60%, transparent); }
footer a { color: var(--primary); }
</style>
</head>
<body>
<div class="wrap">
<header class="top">{{logoImage}}<h1>{{title}}</h1></header>
<p class="lede">{{notice}}</p>
<div class="actions">
  <a href="./index.html">Open the interactive deck</a>
  <a href="./slides.md">Slide source</a>
</div>
{{slides}}
<footer>A static rendering of the presentation, generated by <a href="https://voxgig.com">Voxgig</a>. The interactive deck needs JavaScript. This page does not.</footer>
</div>
</body>
</html>
